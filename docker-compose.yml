version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cbapp_postgres
    environment:
      POSTGRES_DB: cbapp_v1
      POSTGRES_USER: cbapp_user
      POSTGRES_PASSWORD: cbapp_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local