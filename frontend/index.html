<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cbApp V1</title>
    <style>
      /* Initial loading overlay - shown before Vue mounts */
      #initial-loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }

      /* Loading spinner */
      .initial-spinner {
        width: 64px;
        height: 64px;
        border: 6px solid rgba(25, 118, 210, 0.2);
        border-top-color: #1976d2;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      /* Loading text */
      .initial-loading-text {
        position: absolute;
        margin-top: 100px;
        color: white;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        font-size: 18px;
        font-weight: 400;
        letter-spacing: 0.5px;
      }
    </style>
  </head>
  <body>
    <!-- Initial loading overlay (pure HTML/CSS, shown before Vue mounts) -->
    <div id="initial-loading">
      <div>
        <div class="initial-spinner"></div>
        <div class="initial-loading-text">Loading...</div>
      </div>
    </div>

    <!-- Vue app will mount here and replace the loading overlay -->
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
